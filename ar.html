<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Visor AR — Mercado Vivo</title>
    <!-- Librerías estables de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
      
      #pantalla-inicio {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; z-index: 99999; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        box-sizing: border-box;
      }

      .btn-activar {
        background: #25d366; color: white; border: none; padding: 16px 32px;
        font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); margin-top: 20px;
      }

      .hud-ar {
        position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
        z-index: 1000; background: rgba(15, 23, 42, 0.9); color: #ffffff;
        padding: 14px 24px; border-radius: 20px; text-align: center; border: 2px solid #0099ff;
        min-width: 250px;
      }

      .btn-volver {
        position: fixed; top: 15px; left: 15px; z-index: 1000; background: #ffffff;
        color: #000; padding: 8px 16px; border-radius: 20px; text-decoration: none;
        font-weight: bold; font-size: 13px;
      }
    </style>
  </head>
  <body>

    <div id="pantalla-inicio">
      <h2>🍃 Mercado Vivo AR</h2>
      <p>Presiona el botón para activar la cámara.</p>
      <button class="btn-activar" onclick="activarCamara()">📷 Iniciar Cámara AR</button>
    </div>

    <a href="index.html" class="btn-volver">← Volver al Menú</a>

    <div class="hud-ar">
      <h3 style="margin:0; color:#0099ff;">💊 Citrato de Magnesio</h3>
      <p style="margin:0; font-size:13px;">Bionaturista · 100 Unidades</p>
      <div style="font-weight:bold; color:#25d366; font-size:15px; margin-top:4px;">S/ 45.00</div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <img id="etiqueta-frasco" src="imagenes/CitratoDeMagnesio.jpg" crossorigin="anonymous" />
      </a-assets>

      <!-- Rastreador Hiro Activado -->
      <a-marker preset="hiro">
        <!-- Cilindro representando el producto -->
        <a-cylinder
          position="0 0.8 0"
          radius="0.45"
          height="1.3"
          src="#etiqueta-frasco"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear"
        >
          <a-cylinder position="0 0.68 0" radius="0.42" height="0.2" color="#FFFFFF"></a-cylinder>
        </a-cylinder>

        <!-- Sombra en la base -->
        <a-ring
          position="0 0 0"
          rotation="-90 0 0"
          radius-inner="0.1"
          radius-outer="0.7"
          color="#000000"
          opacity="0.4"
        >
        </a-ring>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      function activarCamara() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(function() {
            document.getElementById('pantalla-inicio').style.display = 'none';
          })
          .catch(function(err) {
            alert('Habilita los permisos de cámara en Safari.');
          });
      }
    </script>
  </body>
</html>
