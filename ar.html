<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor AR — Citrato de Magnesio Bionaturista</title>
    <!-- Librerías A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      /* HUD Flotante tipo Juego */
      .hud-ar {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(15, 23, 42, 0.9);
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 20px;
        text-align: center;
        border: 2px solid #0099ff;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        min-width: 270px;
      }
      .hud-ar h3 {
        margin: 0 0 4px 0;
        font-size: 16px;
        color: #0099ff;
      }
      .hud-ar p {
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
      }
      .hud-ar .precio {
        font-weight: bold;
        color: #25d366;
        font-size: 15px;
        margin-top: 4px;
      }

      .btn-volver {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 1000;
        background: #ffffff;
        color: #000;
        padding: 8px 16px;
        border-radius: 20px;
        text-decoration: none;
        font-weight: bold;
        font-size: 13px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="btn-volver">← Volver al Menú</a>

    <!-- Interfaz informativa por encima de la cámara -->
    <div class="hud-ar">
      <h3>💊 Citrato de Magnesio</h3>
      <p>Bionaturista · 100 Unidades (300mg)</p>
      <div class="precio">S/ 45.00</div>
    </div>

    <!-- Escena AR interactiva -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Cargar la imagen del producto como textura -->
      <a-assets>
        <img id="etiqueta-frasco" src="imagenes/CitratoDeMagnesio.jpg" />
      </a-assets>

      <!-- Detector del Marcador Hiro -->
      <a-marker preset="hiro">
        <!-- Frasco en 3D con la foto de Bionaturista, animación flotante y giro continuo -->
        <a-cylinder
          position="0 0.8 0"
          radius="0.45"
          height="1.3"
          src="#etiqueta-frasco"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear"
          animation__flotar="property: position; to: 0 1.1 0; dir: alternate; loop: true; dur: 1500; easing: sine"
        >
          <!-- Tapa blanca del frasco -->
          <a-cylinder
            position="0 0.68 0"
            radius="0.42"
            height="0.2"
            color="#FFFFFF"
          >
          </a-cylinder>

          <!-- Ficha con Precio flotando sobre el producto -->
          <a-text
            value="BIONATURISTA\nS/ 45.00"
            align="center"
            position="0 0.9 0"
            scale="0.8 0.8 0.8"
            color="#0099ff"
            font="kelsonsans"
          >
          </a-text>
        </a-cylinder>

        <!-- Sombra en la base -->
        <a-ring
          position="0 0 0"
          rotation="-90 0 0"
          radius-inner="0.1"
          radius-outer="0.7"
          color="#000000"
          opacity="0.4"
        >
        </a-ring>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
