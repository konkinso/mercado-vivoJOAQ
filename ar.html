<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Visor AR — Mercado Vivo</title>
    <!-- Librerías AR requeridas vía CDN -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
      
      /* Pantalla inicial para iPhone (obligatoria para Safari) */
      #pantalla-inicio {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; z-index: 99999; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
        box-sizing: border-box;
      }

      .btn-activar {
        background: #25d366; color: white; border: none; padding: 16px 32px;
        font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); margin-top: 20px;
        transition: transform 0.2s ease;
      }
      .btn-activar:active { transform: scale(0.95); }

      /* HUD Flotante con info del producto */
      .hud-ar {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        z-index: 1000; background: rgba(15, 23, 42, 0.9); color: #ffffff;
        padding: 14px 24px; border-radius: 20px; text-align: center; border: 2px solid #0099ff;
        min-width: 260px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .hud-ar h3 { margin: 0 0 5px 0; color: #0099ff; font-size: 18px; }
      .hud-ar p { margin: 0; font-size: 14px; opacity: 0.9; }
      .hud-ar .precio { font-weight: bold; color: #25d366; font-size: 16px; margin-top: 6px; }

      .btn-volver {
        position: fixed; top: 20px; left: 20px; z-index: 1000; background: #ffffff;
        color: #000; padding: 10px 18px; border-radius: 20px; text-decoration: none;
        font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <!-- Pantalla de Bienvenida para Safari -->
    <div id="pantalla-inicio">
      <h2>🍃 Mercado Vivo AR</h2>
      <p>Pulsa el botón para activar la cámara.</p>
      <button class="btn-activar" onclick="activarExperiencia()">📷 Iniciar Cámara AR</button>
    </div>

    <!-- Botón Volver y HUD -->
    <a href="index.html" class="btn-volver">← Volver al Menú</a>
    <div class="hud-ar">
      <h3>💊 Citrato de Magnesio</h3>
      <p>Bionaturista · 100 Unidades (300mg)</p>
      <div class="precio">S/ 45.00</div>
    </div>

    <!-- Escena AR optimizada para rastreo de imagen -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; videoTexture: true; deviceOrientationEnabled: true;" 
      renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
    >
      <a-assets>
        <!-- Imagen del frasco cargada localmente como textura -->
        <img id="etiqueta-frasco" src="imagenes/CitratoDeMagnesio.jpg" crossorigin="anonymous" />
      </a-assets>

      <!-- Configuramos el tracker para tu imagen local -->
      <!-- 'type: nft' activa el rastreo de imagen profesional -->
      <a-marker type="nft" url="https://konkinso.github.io/mercado-vivoJOAQ/marcadores/CitratoDeMagnesio" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        
        <!-- Frasco 3D sobre la imagen: ajustado para encajar -->
        <a-cylinder
          position="0 0.6 0"
          radius="0.45"
          height="1.3"
          src="#etiqueta-frasco"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
        >
          <!-- Tapa blanca -->
          <a-cylinder position="0 0.68 0" radius="0.43" height="0.2" color="#FFFFFF"></a-cylinder>

          <!-- Texto con el precio flotante -->
          <a-text
            value="BIONATURISTA\nS/ 45.00"
            align="center"
            position="0 0.9 0"
            scale="0.8 0.8 0.8"
            color="#0099ff"
            font="kelsonsans"
          >
          </a-text>
        </a-cylinder>

        <!-- Sombra en la base para realismo -->
        <a-ring
          position="0 0 0"
          rotation="-90 0 0"
          radius-inner="0.1"
          radius-outer="0.7"
          color="#000000"
          opacity="0.5"
        >
        </a-ring>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      function activarExperiencia() {
        // Pedimos permiso de cámara explícito para iPhone (iOS Safari)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
          .then(function() {
            // Ocultamos la pantalla de bienvenida si hay permiso
            document.getElementById('pantalla-inicio').style.display = 'none';
          })
          .catch(function(err) {
            // Reintento genérico si falla la cámara trasera estricta
            navigator.mediaDevices.getUserMedia({ video: true })
              .then(function() {
                document.getElementById('pantalla-inicio').style.display = 'none';
              })
              .catch(function() {
                alert('No se pudo acceder a la cámara. Por favor, revisa los permisos de Safari en Ajustes.');
              });
          });
      }
    </script>
  </body>
</html>
