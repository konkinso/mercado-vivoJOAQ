<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ver en AR — Proyecto Inmobiliario</title>

  <!-- Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>

    /* =========================
       CONFIGURACIÓN GENERAL
    ========================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0E1512;
    }


    /* =========================
       VISOR 3D
    ========================== */

    model-viewer {
      width: 100%;
      height: 100vh;

      background: #0E1512;

      --poster-color: #0E1512;

      display: block;
    }


    /* =========================
       BOTÓN VOLVER
    ========================== */

    .btn-volver {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 18px;

      background: rgba(255, 255, 255, 0.95);

      color: #000;

      border-radius: 25px;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    .btn-volver:hover {

      transform: scale(1.05);

      background: #ffffff;
    }


    /* =========================
       BOTÓN AR
    ========================== */

    .boton-ar {

      position: absolute;

      bottom: 30px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      border: none;

      padding: 15px 28px;

      border-radius: 999px;

      background: #1F3A2E;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    .boton-ar:hover {

      background: #2d5945;

      transform:
        translateX(-50%)
        scale(1.05);
    }


    .boton-ar:active {

      transform:
        translateX(-50%)
        scale(0.98);
    }


    /* =========================
       INFORMACIÓN DEL MODELO
    ========================== */

    .info-modelo {

      position: fixed;

      top: 18px;

      right: 18px;

      z-index: 1000;

      padding: 10px 16px;

      background: rgba(255, 255, 255, 0.92);

      color: #1F3A2E;

      border-radius: 20px;

      font-size: 13px;

      font-weight: 700;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.2);
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 600px) {

      .btn-volver {

        top: 12px;
        left: 12px;

        padding: 8px 14px;

        font-size: 13px;
      }


      .info-modelo {

        top: 12px;
        right: 12px;

        font-size: 11px;

        padding: 8px 12px;
      }


      .boton-ar {

        bottom: 25px;

        padding: 13px 22px;

        font-size: 14px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       BOTÓN VOLVER
  ========================== -->

  <a
    href="index.html"
    class="btn-volver">

    ← Volver

  </a>


  <!-- =========================
       NOMBRE DEL MODELO
  ========================== -->

  <div class="info-modelo">

    🪵 Ropero 3D

  </div>


  <!-- =========================
       VISOR 3D
  ========================== -->

  <model-viewer

    id="visor"

    src="modelos/RoperoPapa_3D_PARADO.glb"

    alt="Ropero de madera 3D"

    ar

    ar-modes="webxr scene-viewer quick-look"

    camera-controls

    auto-rotate

    rotation-per-second="20deg"

    shadow-intensity="1"

    shadow-softness="1"

    exposure="1"

    environment-image="neutral"

    camera-orbit="0deg 75deg 4m"

    field-of-view="35deg"

    interaction-prompt="auto">


    <!-- =========================
         BOTÓN DE REALIDAD AUMENTADA
    ========================== -->

    <button
      slot="ar-button"
      class="boton-ar">

      📱 Ver en tu espacio (AR)

    </button>


  </model-viewer>


</body>

</html>
