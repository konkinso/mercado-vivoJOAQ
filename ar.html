<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ver en AR — Mercado Vivo</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body{margin:0;background:#0E1512;font-family:system-ui,sans-serif;}
  model-viewer{width:100%;height:100vh;background:#0E1512;}
  .btn-volver{
    position:fixed;top:15px;left:15px;z-index:999;
    background:#fff;color:#000;padding:8px 16px;border-radius:20px;
    text-decoration:none;font-weight:bold;font-size:13px;
  }
  .boton-ar{
    background:#1F3A2E;color:#fff;padding:14px 26px;border-radius:999px;
    font-weight:700;border:none;font-size:1rem;
  }
</style>
</head>
<body>

<a href="index.html" class="btn-volver">← Volver</a>

<model-viewer
  src="modelos/frasco-generico.glb"
  alt="Producto en 3D"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1">
  <button slot="ar-button" class="boton-ar">
    📱 Ver en tu espacio (AR)
  </button>
</model-viewer>

</body>
</html>
