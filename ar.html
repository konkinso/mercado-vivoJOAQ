<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Visor AR — Mercado Vivo</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
      #pantalla-inicio {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; z-index: 99999; display: flex; flex-direction: column;
        justify-content: center; align-items: center; color: white; text-align: center; padding: 20px;
      }
      .btn-activar {
        background: #25d366; color: white; border: none; padding: 16px 32px;
        font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      }
      .hud-ar {
        position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
        z-index: 1000; background: rgba(15, 23, 42, 0.9); color: #ffffff;
        padding: 12px 20px; border-radius: 20px; text-align: center; border: 2px solid #0099ff;
      }
    </style>
  </head>
  <body>

    <div id="pantalla-inicio">
      <h2>🍃 Mercado Vivo AR</h2>
      <p>Apunta al marcador Hiro tras activar la cámara.</p>
      <button class="btn-activar" onclick="activarCamara()">📷 Iniciar Cámara AR</button>
    </div>

    <div class="hud-ar">
      <h3 style="margin:0; color:#0099ff;">💊 Citrato de Magnesio</h3>
      <p style="margin:0; font-size:12px;">Bionaturista · 100 Unidades</p>
      <div style="font-weight:bold; color:#25d366; margin-top:3px;">S/ 45.00</div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <!-- Cilindro 3D con color visible de respaldo y rotación -->
        <a-cylinder 
          position="0 0.8 0" 
          radius="0.45" 
          height="1.3" 
          color="#00a896"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
          <a-cylinder position="0 0.68 0" radius="0.42" height="0.2" color="#FFFFFF"></a-cylinder>
        </a-cylinder>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      function activarCamara() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(function() {
            document.getElementById('pantalla-inicio').style.display = 'none';
          })
          .catch(function(err) {
            alert('Habilita los permisos de cámara en Safari.');
          });
      }
    </script>
  </body>
</html>
